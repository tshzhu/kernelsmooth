name: Build wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-wheels:
    name: ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
          - windows-latest
          - windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ github.run_id }}
          path: wheelhouse/*.whl
          if-no-files-found: error
